{% extends "base_staff.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 860px;"><div class="card-body">
  {% if help %}<p class="small text-body-secondary">{{ help }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
      {% if can_delete %}<button class="btn btn-outline-danger ms-auto" name="delete" value="1" formnovalidate onclick="return confirm('Delete this item?')">Delete</button>{% endif %}
    </div>
  </form>
</div></div>
{% endblock %}
