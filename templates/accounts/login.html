{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login · {{ hotel.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/staff.css' %}" rel="stylesheet">
</head>
<body class="staff d-flex align-items-center min-vh-100" style="background: linear-gradient(135deg,#0f172a,#115e59);">
  <div class="container" style="max-width: 420px;">
    <div class="text-center text-white mb-4">
      <span class="brand-mark fs-4" style="width:52px;height:52px;"><i class="bi bi-building"></i></span>
      <h1 class="h4 mt-3 mb-0">{{ hotel.name }}</h1>
      <div class="text-white-50 small">Hotel management system</div>
    </div>
    <div class="card shadow-lg border-0">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Staff sign in</h2>
        {% if form.errors %}<div class="alert alert-danger py-2">Incorrect username or password.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}</div>
          <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}</div>
          <button class="btn btn-primary btn-lg w-100">Sign in</button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3"><a href="/" class="text-white-50 small"><i class="bi bi-arrow-left"></i> Back to website</a></div>
  </div>
</body>
</html>
