{# Live STK push status. Needs: tx_id; optional success_url, simulate (bool) #}
<div class="mpesa-status card border-0 shadow-sm mb-3" data-mpesa-tx="{{ tx_id }}"
     data-status-url="{% url 'mpesa:status' tx_id %}" data-simulate-url="{% url 'mpesa:simulate' tx_id %}"
     {% if success_url %}data-success-url="{{ success_url }}"{% endif %}>
  <div class="card-body d-flex align-items-start gap-3">
    <div class="mpesa-icon fs-2 text-success"><span class="spinner-border text-success" role="status"></span></div>
    <div class="flex-grow-1">
      <div class="fw-semibold mpesa-title">Waiting for M-Pesa confirmation…</div>
      <div class="small text-body-secondary mpesa-message">A PIN prompt has been sent to the phone. Enter your M-Pesa PIN to complete payment.</div>
      <div class="mpesa-sim mt-2 d-none">
        <div class="small text-warning-emphasis mb-1"><i class="bi bi-cone-striped"></i> Simulation mode – no real money moves. Choose an outcome:</div>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-sm btn-success" data-outcome="success">Customer pays</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-outcome="cancel">Customer cancels</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-outcome="insufficient">Insufficient funds</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-outcome="wrong_pin">Wrong PIN</button>
        </div>
      </div>
    </div>
  </div>
</div>
