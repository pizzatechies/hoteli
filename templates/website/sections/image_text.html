<div class="container"><div class="row g-5 align-items-center {% if section.image_right %}flex-lg-row-reverse{% endif %}">
  <div class="col-lg-6">{% if section.image_url %}<img src="{{ section.image_url }}" alt="{{ section.title }}" class="gallery-img shadow-sm" loading="lazy">{% else %}<div class="room-img-placeholder rounded-4"><i class="bi bi-image"></i></div>{% endif %}</div>
  <div class="col-lg-6">
    {% if section.eyebrow %}<div class="eyebrow">{{ section.eyebrow }}</div>{% endif %}
    {% if section.title %}<h2 class="section-title mb-3">{{ section.title }}</h2>{% endif %}
    <div class="text-body-secondary lh-lg">{{ section.body|linebreaks }}</div>
    {% if section.button_text and section.button_url %}<a href="{{ section.button_url }}" class="btn btn-brand mt-2">{{ section.button_text }}</a>{% endif %}
  </div>
</div></div>
