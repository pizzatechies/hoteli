<div class="container">
  <div class="row g-4 align-items-center">
    <div class="col-lg-4">
      {% if section.title %}<h2 class="section-title mb-3">{{ section.title }}</h2>{% endif %}
      <div class="text-body-secondary">{{ section.body|linebreaks }}</div>
      <ul class="list-unstyled small">
        {% if hotel.address %}<li class="mb-2"><i class="bi bi-geo-alt text-brand"></i> {{ hotel.address }}</li>{% endif %}
        {% if hotel.phone %}<li><i class="bi bi-telephone text-brand"></i> <a href="tel:{{ hotel.phone|cut:' ' }}">{{ hotel.phone }}</a></li>{% endif %}
      </ul>
    </div>
    <div class="col-lg-8">
      {% if section.embed_url %}<div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm"><iframe src="{{ section.embed_url }}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map"></iframe></div>
      {% else %}<div class="room-img-placeholder rounded-4"><i class="bi bi-map"></i></div>{% endif %}
    </div>
  </div>
</div>
