<div class="container">
  {% include "website/sections/_heading.html" with center=True %}
  <div class="row g-4 justify-content-center">
    {% for t in section.testimonials %}
    <div class="col-md-6 col-lg-4"><div class="card quote-card"><div class="card-body p-4">
      <i class="bi bi-quote fs-2 text-brand"></i>
      <p class="mb-3">{{ t.quote }}</p>
      <div class="fw-semibold">{{ t.name }}</div>{% if t.origin %}<div class="small text-body-secondary">{{ t.origin }}</div>{% endif %}
    </div></div></div>
    {% endfor %}
  </div>
</div>
