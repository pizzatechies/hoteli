AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Hoteli hotel management system: ECS Fargate (web + background jobs), RDS PostgreSQL with
  daily backups, Application Load Balancer, CloudFront (free HTTPS), Secrets Manager and logs.
  Deployed by .github/workflows/aws-deploy.yml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: App }
        Parameters: [ImageUri, EnvName, DesiredCount, TaskCpu, TaskMemory, TimeZone, AdminUsername, AdminEmail]
      - Label: { default: Database }
        Parameters: [DBInstanceClass, DBAllocatedStorage, DBBackupRetentionDays]
      - Label: { default: Custom domain (optional) }
        Parameters: [CustomDomain, CertificateArn]
      - Label: { default: M-Pesa }
        Parameters: [MpesaEnvironment, MpesaShortcode, MpesaTransactionType, MpesaTillNumber, MpesaC2BShortcode, MpesaB2CShortcode]
      - Label: { default: Email and SMS }
        Parameters: [EmailHost, EmailPort, DefaultFromEmail, SmsBackend, SmsUsername, SmsSenderId]

Parameters:
  ImageUri:
    Type: String
    Description: Container image to run (set by the deploy workflow).
  EnvName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "3072", "4096"]
  TimeZone:
    Type: String
    Default: Africa/Nairobi
  AdminUsername:
    Type: String
    Default: admin
    Description: First administrator login (its password is generated in Secrets Manager).
  AdminEmail:
    Type: String
    Default: ""
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  DBBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  CustomDomain:
    Type: String
    Default: ""
    Description: Optional, e.g. book.myhotel.co.ke. Leave blank to use the free *.cloudfront.net address.
  CertificateArn:
    Type: String
    Default: ""
    Description: Required with CustomDomain. An ACM certificate for that domain in us-east-1.
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/.+$"
  MpesaEnvironment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, production]
  MpesaShortcode:
    Type: String
    Default: "174379"
  MpesaTransactionType:
    Type: String
    Default: CustomerPayBillOnline
    AllowedValues: [CustomerPayBillOnline, CustomerBuyGoodsOnline]
  MpesaTillNumber:
    Type: String
    Default: ""
  MpesaC2BShortcode:
    Type: String
    Default: ""
  MpesaB2CShortcode:
    Type: String
    Default: ""
    Description: Shortcode used to send refunds to guests (B2C). Blank uses MpesaShortcode.
  EmailHost:
    Type: String
    Default: ""
    Description: SMTP host, e.g. email-smtp.eu-west-1.amazonaws.com for Amazon SES. Blank logs emails instead.
  EmailPort:
    Type: String
    Default: "587"
  DefaultFromEmail:
    Type: String
    Default: ""
    Description: Sender address, e.g. reservations@myhotel.co.ke (must be verified in SES).
  SmsBackend:
    Type: String
    Default: console
    AllowedValues: [console, africastalking]
  SmsUsername:
    Type: String
    Default: sandbox
    Description: Africa's Talking username ("sandbox" for testing).
  SmsSenderId:
    Type: String
    Default: ""

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, ""]]
  HasEmail: !Not [!Equals [!Ref EmailHost, ""]]

Resources:
  # ---------------------------------------------------------------- network (no NAT gateway, to keep costs low)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "hoteli-${EnvName}" }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "hoteli-${EnvName}-public-a" }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "hoteli-${EnvName}-public-b" }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "hoteli-${EnvName}-private-a" }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "hoteli-${EnvName}-private-b" }]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hoteli load balancer (reached through CloudFront only; enforced by a secret header)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hoteli app containers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hoteli PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ---------------------------------------------------------------- secrets
  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "hoteli/${EnvName}/django-secret-key"
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: "\"'`\\$ "
  CallbackToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "hoteli/${EnvName}/mpesa-callback-token"
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
  AdminPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "hoteli/${EnvName}/admin-password"
      Description: Password for the first administrator login (change it after signing in).
      GenerateSecretString:
        PasswordLength: 20
        ExcludePunctuation: true
  DatabaseCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "hoteli/${EnvName}/database"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "hoteli"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  # Fill these in from the AWS console (Secrets Manager), then restart the app from the deploy workflow.
  # Do not edit this resource in the template later: CloudFormation would overwrite your saved values.
  Integrations:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "hoteli/${EnvName}/integrations"
      Description: M-Pesa, email and SMS credentials for Hoteli. Edit the values, then restart the app.
      SecretString: >-
        {"MPESA_CONSUMER_KEY": "", "MPESA_CONSUMER_SECRET": "",
        "MPESA_PASSKEY": "bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919",
        "MPESA_B2C_INITIATOR_NAME": "", "MPESA_B2C_SECURITY_CREDENTIAL": "",
        "EMAIL_HOST_USER": "", "EMAIL_HOST_PASSWORD": "", "SMS_API_KEY": ""}

  # ---------------------------------------------------------------- database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Hoteli private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "18"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBName: hoteli
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseCredentials}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseCredentials}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: !Ref DBBackupRetentionDays
      PreferredBackupWindow: "00:00-01:00"
      PreferredMaintenanceWindow: "sun:01:30-sun:02:30"
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true

  # ---------------------------------------------------------------- load balancer + CloudFront (HTTPS)
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "65" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /healthz/
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Please use the hotel's website address.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Hoteli-Origin
            Values: [!Select [2, !Split ["/", !Ref "AWS::StackId"]]]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]   # CertificateArn is only used when CustomDomain is set
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Hoteli ${EnvName}"
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: app
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Hoteli-Origin
                HeaderValue: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
            OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc

  # ---------------------------------------------------------------- containers
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "hoteli-${EnvName}"
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/hoteli/${EnvName}"
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "hoteli-${EnvName}-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-hoteli-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DjangoSecretKey
                  - !Ref CallbackToken
                  - !Ref AdminPassword
                  - !Ref DatabaseCredentials
                  - !Ref Integrations
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "hoteli-${EnvName}-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "hoteli-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          Command: [web]
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          HealthCheck:
            Command: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          Environment:
            - { Name: DEBUG, Value: "False" }
            - { Name: RUN_MIGRATIONS, Value: "true" }
            - Name: ALLOWED_HOSTS
              Value: !If [HasCustomDomain, !Sub "${Distribution.DomainName},${CustomDomain}", !GetAtt Distribution.DomainName]
            - Name: CSRF_TRUSTED_ORIGINS
              Value: !If [HasCustomDomain, !Sub "https://${Distribution.DomainName},https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - Name: SITE_URL
              Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - Name: MPESA_CALLBACK_BASE_URL
              Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - { Name: SECURE_PROXY_SSL_HEADER_NAME, Value: HTTP_CLOUDFRONT_FORWARDED_PROTO }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: hoteli }
            - { Name: DB_SSLMODE, Value: require }
            - { Name: TIME_ZONE, Value: !Ref TimeZone }
            - { Name: DJANGO_ADMIN_USERNAME, Value: !Ref AdminUsername }
            - { Name: DJANGO_ADMIN_EMAIL, Value: !Ref AdminEmail }
            - { Name: MPESA_ENVIRONMENT, Value: !Ref MpesaEnvironment }
            - { Name: MPESA_SHORTCODE, Value: !Ref MpesaShortcode }
            - { Name: MPESA_TRANSACTION_TYPE, Value: !Ref MpesaTransactionType }
            - { Name: MPESA_TILL_NUMBER, Value: !Ref MpesaTillNumber }
            - { Name: MPESA_C2B_SHORTCODE, Value: !Ref MpesaC2BShortcode }
            - { Name: MPESA_B2C_SHORTCODE, Value: !Ref MpesaB2CShortcode }
            - Name: EMAIL_BACKEND
              Value: !If [HasEmail, django.core.mail.backends.smtp.EmailBackend, django.core.mail.backends.console.EmailBackend]
            - { Name: EMAIL_HOST, Value: !Ref EmailHost }
            - { Name: EMAIL_PORT, Value: !Ref EmailPort }
            - { Name: DEFAULT_FROM_EMAIL, Value: !Ref DefaultFromEmail }
            - { Name: SMS_BACKEND, Value: !Ref SmsBackend }
            - { Name: SMS_USERNAME, Value: !Ref SmsUsername }
            - { Name: SMS_SENDER_ID, Value: !Ref SmsSenderId }
            - { Name: WEB_CONCURRENCY, Value: "3" }
          Secrets:
            - { Name: SECRET_KEY, ValueFrom: !Ref DjangoSecretKey }
            - { Name: MPESA_CALLBACK_TOKEN, ValueFrom: !Ref CallbackToken }
            - { Name: DJANGO_ADMIN_PASSWORD, ValueFrom: !Ref AdminPassword }
            - { Name: DB_USER, ValueFrom: !Sub "${DatabaseCredentials}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DatabaseCredentials}:password::" }
            - { Name: MPESA_CONSUMER_KEY, ValueFrom: !Sub "${Integrations}:MPESA_CONSUMER_KEY::" }
            - { Name: MPESA_CONSUMER_SECRET, ValueFrom: !Sub "${Integrations}:MPESA_CONSUMER_SECRET::" }
            - { Name: MPESA_PASSKEY, ValueFrom: !Sub "${Integrations}:MPESA_PASSKEY::" }
            - { Name: MPESA_B2C_INITIATOR_NAME, ValueFrom: !Sub "${Integrations}:MPESA_B2C_INITIATOR_NAME::" }
            - { Name: MPESA_B2C_SECURITY_CREDENTIAL, ValueFrom: !Sub "${Integrations}:MPESA_B2C_SECURITY_CREDENTIAL::" }
            - { Name: EMAIL_HOST_USER, ValueFrom: !Sub "${Integrations}:EMAIL_HOST_USER::" }
            - { Name: EMAIL_HOST_PASSWORD, ValueFrom: !Sub "${Integrations}:EMAIL_HOST_PASSWORD::" }
            - { Name: SMS_API_KEY, ValueFrom: !Sub "${Integrations}:SMS_API_KEY::" }
        - Name: jobs
          Image: !Ref ImageUri
          Essential: false
          Command: [jobs]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: jobs
          Environment:
            - { Name: DEBUG, Value: "False" }
            - { Name: RUN_MIGRATIONS, Value: "false" }
            - Name: ALLOWED_HOSTS
              Value: !If [HasCustomDomain, !Sub "${Distribution.DomainName},${CustomDomain}", !GetAtt Distribution.DomainName]
            - Name: CSRF_TRUSTED_ORIGINS
              Value: !If [HasCustomDomain, !Sub "https://${Distribution.DomainName},https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - Name: SITE_URL
              Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - Name: MPESA_CALLBACK_BASE_URL
              Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}", !Sub "https://${Distribution.DomainName}"]
            - { Name: SECURE_PROXY_SSL_HEADER_NAME, Value: HTTP_CLOUDFRONT_FORWARDED_PROTO }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: hoteli }
            - { Name: DB_SSLMODE, Value: require }
            - { Name: TIME_ZONE, Value: !Ref TimeZone }
            - { Name: DJANGO_ADMIN_USERNAME, Value: !Ref AdminUsername }
            - { Name: DJANGO_ADMIN_EMAIL, Value: !Ref AdminEmail }
            - { Name: MPESA_ENVIRONMENT, Value: !Ref MpesaEnvironment }
            - { Name: MPESA_SHORTCODE, Value: !Ref MpesaShortcode }
            - { Name: MPESA_TRANSACTION_TYPE, Value: !Ref MpesaTransactionType }
            - { Name: MPESA_TILL_NUMBER, Value: !Ref MpesaTillNumber }
            - { Name: MPESA_C2B_SHORTCODE, Value: !Ref MpesaC2BShortcode }
            - { Name: MPESA_B2C_SHORTCODE, Value: !Ref MpesaB2CShortcode }
            - Name: EMAIL_BACKEND
              Value: !If [HasEmail, django.core.mail.backends.smtp.EmailBackend, django.core.mail.backends.console.EmailBackend]
            - { Name: EMAIL_HOST, Value: !Ref EmailHost }
            - { Name: EMAIL_PORT, Value: !Ref EmailPort }
            - { Name: DEFAULT_FROM_EMAIL, Value: !Ref DefaultFromEmail }
            - { Name: SMS_BACKEND, Value: !Ref SmsBackend }
            - { Name: SMS_USERNAME, Value: !Ref SmsUsername }
            - { Name: SMS_SENDER_ID, Value: !Ref SmsSenderId }
            - { Name: WEB_CONCURRENCY, Value: "3" }
          Secrets:
            - { Name: SECRET_KEY, ValueFrom: !Ref DjangoSecretKey }
            - { Name: MPESA_CALLBACK_TOKEN, ValueFrom: !Ref CallbackToken }
            - { Name: DJANGO_ADMIN_PASSWORD, ValueFrom: !Ref AdminPassword }
            - { Name: DB_USER, ValueFrom: !Sub "${DatabaseCredentials}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DatabaseCredentials}:password::" }
            - { Name: MPESA_CONSUMER_KEY, ValueFrom: !Sub "${Integrations}:MPESA_CONSUMER_KEY::" }
            - { Name: MPESA_CONSUMER_SECRET, ValueFrom: !Sub "${Integrations}:MPESA_CONSUMER_SECRET::" }
            - { Name: MPESA_PASSKEY, ValueFrom: !Sub "${Integrations}:MPESA_PASSKEY::" }
            - { Name: MPESA_B2C_INITIATOR_NAME, ValueFrom: !Sub "${Integrations}:MPESA_B2C_INITIATOR_NAME::" }
            - { Name: MPESA_B2C_SECURITY_CREDENTIAL, ValueFrom: !Sub "${Integrations}:MPESA_B2C_SECURITY_CREDENTIAL::" }
            - { Name: EMAIL_HOST_USER, ValueFrom: !Sub "${Integrations}:EMAIL_HOST_USER::" }
            - { Name: EMAIL_HOST_PASSWORD, ValueFrom: !Sub "${Integrations}:EMAIL_HOST_PASSWORD::" }
            - { Name: SMS_API_KEY, ValueFrom: !Sub "${Integrations}:SMS_API_KEY::" }

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: hoteli-web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED      # lets containers reach M-Pesa/ECR without a paid NAT gateway
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  WebsiteURL:
    Description: The hotel website.
    Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}/", !Sub "https://${Distribution.DomainName}/"]
  StaffURL:
    Description: Staff login.
    Value: !If [HasCustomDomain, !Sub "https://${CustomDomain}/staff/", !Sub "https://${Distribution.DomainName}/staff/"]
  CloudFrontDomain:
    Description: Point a custom domain's CNAME here (then set CustomDomain and CertificateArn).
    Value: !GetAtt Distribution.DomainName
  AdminUsername:
    Value: !Ref AdminUsername
  AdminPasswordSecret:
    Description: Open this secret in Secrets Manager to read the first admin password.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/secretsmanager/secret?name=hoteli/${EnvName}/admin-password"
  IntegrationsSecret:
    Description: Add M-Pesa, email and SMS keys here, then restart the app.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/secretsmanager/secret?name=hoteli/${EnvName}/integrations"
  Logs:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fhoteli$252F${EnvName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
