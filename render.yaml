# Render Blueprint: web service + PostgreSQL + scheduled jobs.
# Set MPESA_* secrets and DJANGO_ADMIN_* in the Render dashboard (sync: false).
databases:
  - name: hoteli-db
    plan: free
    databaseName: hoteli
    user: hoteli

services:
  - type: web
    name: hoteli
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn hoteli.wsgi --workers 3 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase: { name: hoteli-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SITE_URL
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
